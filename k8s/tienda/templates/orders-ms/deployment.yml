apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-ms
  labels:
    app: orders-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-ms
  template:
    metadata:
      labels:
        app: orders-ms
    spec:
      containers:
        - name: orders-ms
          image: "{{ .Values.image.registry }}/orders-ms:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "3000"
            - name: NATS_SERVERS
              value: "{{ .Values.nats.url }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: ORDERS_DATABASE_URL


services:

  nats-server:
    image: nats:latest
    ports:
      - 8222:8222
      - 4222:4222

  client-gateway:
    build: ./client-gateway
    ports:
      - ${CLIENT_GATEWAY_PORT}:3000
    volumes:
      - ./client-gateway/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3000
      - NATS_SERVERS=nats://nats-server:4222
  products-microservice:
    build: ./products-ms
    volumes:
      - ./products-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3001
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=file:./dev.db
  
  orders-ms:
    depends_on:
      - orders-db
    restart: unless-stopped
    build: ./orders-ms
    command: npm run start:dev
    environment:
      - PORT=3002
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=postgresql://postgres:123456@orders-db:5432/ordersdb
    volumes:
      - ./orders-ms/src:/usr/src/app/src
  orders-db:
    container_name: orders_database
    image: postgres:16
    restart: always
    user: "1000:1000"

    volumes:
      - ./orders-ms/postgres:/var/lib/postgresql/data

    ports:
      - 5433:5432

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=ordersdb
  
  payments-ms:
    container_name: payments-ms
    build: ./payments-ms
    volumes:
      - ./payments-ms/src:/usr/src/app/src
    command: npm run start:dev
    ports:
      - ${PAYMENT_MS_PORT}:${PAYMENT_MS_PORT}
    environment:
      - PORT=${PAYMENT_MS_PORT}
      - NATS_SERVERS=nats://nats-server:4222
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
      - STRIPE_ENDPOINT_SECRET=${STRIPE_ENDPOINT_SECRET}

  auth-ms:
    container_name: auth-ms
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    build: ./auth-ms
    command: npm run start:dev
    environment:
      - PORT=${AUTH_MS_PORT}
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=mongodb://auth-db:27017/authms?directConnection=true
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    volumes:
      - ./auth-ms/src:/usr/src/app/src

  auth-db:
    container_name: auth_database
    image: mongo:7
    restart: always
    # Prisma exige que MongoDB corra como replica set (aunque sea de un solo
    # nodo) para poder usar transacciones.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - 27017:27017
    volumes:
      - auth-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'auth-db:27017'}]}).ok }" || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  auth-mongo-data:


    